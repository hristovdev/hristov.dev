# Secrets come from Doppler on the host — never from a committed .env.
#
#   Development:  doppler run -- docker compose --profile dev up
#   Production:   doppler run -- docker compose --profile prod up -d --build
#
# `doppler run` exports the secrets into this process's environment, and the
# `${VAR}` references below pass them through to the container. Nothing
# sensitive is written to disk or baked into an image.

name: hristov-dev

services:
  # ------------------------------------------------------------- production
  web:
    profiles: ['prod']
    build:
      context: .
      target: runner
      args:
        # Inlined into the client bundle at build time — public by definition.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://hristov.dev}
    image: hristov-dev:latest
    ports:
      - '${PORT:-3000}:3000'
    environment:
      # Required in production. Compose interpolates every service regardless
      # of the active profile, so this cannot be a hard `:?` requirement
      # without breaking the dev profile. A missing key does not stop the site
      # serving — /api/contact logs a clear error and returns 502.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://hristov.dev}
    restart: unless-stopped

  # ------------------------------------------------------------ development
  dev:
    profiles: ['dev']
    build:
      context: .
      target: dev
    ports:
      - '${DEV_PORT:-3000}:3000'
    environment:
      # Optional in development: without it, submissions are logged instead
      # of sent, so the form still works with no secrets configured.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      # Keep container-built node_modules and .next out of the host tree.
      # Docker seeds these only on creation, so they go stale when dependencies
      # change; docker/dev-entrypoint.sh re-syncs both against the lockfile.
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next

volumes:
  dev_node_modules:
  dev_next:
