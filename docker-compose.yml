services:
  # Production: docker compose up --build web
  web:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  # Development with hot reload: docker compose --profile dev up dev
  dev:
    profiles: ['dev']
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - '3000:3000'
    environment:
      NEXT_TELEMETRY_DISABLED: 1
      WATCHPACK_POLLING: 'true'
    env_file:
      - path: .env
        required: false
    volumes:
      - .:/app
      - dev_node_modules:/app/node_modules
      - dev_next:/app/.next

volumes:
  dev_node_modules:
  dev_next:
